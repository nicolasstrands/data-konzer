name: Validate and refresh datasets

on:
  pull_request:
  push:
    branches: [main]
    paths: ["data/**", "fetch.py", "links.json", "requirements.txt", ".github/workflows/scrape.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: read
concurrency:
  group: holidays-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python fetch.py --check

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python fetch.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data; then
            echo "No dataset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): refresh public holidays"
          git push
